[project]
name = "assignment-template"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.140.13",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
