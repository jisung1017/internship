[project]
name = "assignment-template"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "sqlacodegen>=4.0.4",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
