services:
  postgres:
    image: postgres:17

    container_name: kiosk-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: kiosk
      POSTGRES_PASSWORD: jisung
      POSTGRES_DB: kiosk

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
