services:
  db:
    image: postgres:17
    container_name: kiosk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migration:
    build: .
    container_name: kiosk-migration
    env_file:
      - .env
    command: >
      sh -c "alembic upgrade head && 
             python -c 'import os; from sqlalchemy import create_engine; from sqlalchemy.orm import sessionmaker; from src.infrastructure.seeder import seed_initial_data_from_json; url = os.environ[\"DATABASE_URL\"].replace(\"postgresql://\", \"postgresql+psycopg://\"); engine = create_engine(url); Session = sessionmaker(bind=engine); session = Session(); seed_initial_data_from_json(session); session.close()'"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    container_name: kiosk-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  postgres-data:
